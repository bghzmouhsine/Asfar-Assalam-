<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Mouhsine — Kitchen Display</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120B07">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #120B07; --panel: #1E140E; --card: #2A1D15; --line: #3B2A1F; --text: #F6EBDD; --soft: #BDA48F;
    --caramel: #D99B5B; --new: #5B8DEF; --prep: #E6A23C; --ready: #4CB872; --late: #E0533D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
  [dir="rtl"] body { font-family: "Cairo", "Inter", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--caramel); outline-offset: 2px; }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .brand small { display: block; font-size: .65rem; letter-spacing: .2em; color: var(--caramel); font-weight: 700; }
  .clock { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-inline-start: 8px; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; border: 1px solid var(--line); }
  .seg button { padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: .85rem; color: var(--soft); }
  .seg button.active { background: var(--caramel); color: #1A110C; }
  .spacer { flex: 1; }
  a.tool { color: inherit; text-decoration: none; }
  .tool { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); font-weight: 700; font-size: .85rem; background: var(--card); }
  .tool:hover { border-color: var(--caramel); }
  .tool.primary { background: var(--caramel); color: #1A110C; border-color: var(--caramel); }
  .tool.off { opacity: .55; }
  .mode-pill { font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--line); color: var(--soft); }
  .mode-pill.on { background: rgba(76,184,114,.18); color: var(--ready); }
  .stats { display: flex; gap: 14px; font-size: .8rem; color: var(--soft); }
  .stats b { color: var(--text); font-size: 1rem; }

  /* ---------- columns ---------- */
  .board { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; min-height: 0; }
  .col { background: var(--panel); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; border-top: 4px solid var(--c); }
  .col[data-s="new"] { --c: var(--new); } .col[data-s="preparing"] { --c: var(--prep); } .col[data-s="ready"] { --c: var(--ready); }
  .col-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: .85rem; }
  [dir="rtl"] .col-head { letter-spacing: 0; font-size: .95rem; }
  .count { background: var(--c); color: #120B07; min-width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; padding: 0 8px; }
  .list { flex: 1; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 10px; }
  .empty { color: var(--soft); text-align: center; padding: 30px 10px; font-size: .9rem; }
  @media (max-width: 900px) {
    html, body { height: auto; }
    body { overflow: auto; display: block; }
    .board { display: flex; flex-direction: column; }
    .col { min-height: 140px; }
    .list { overflow: visible; }
  }

  /* ---------- ticket ---------- */
  .ticket { background: var(--card); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; animation: in .35s ease; }
  @keyframes in { from { transform: scale(.96); opacity: 0; } }
  .ticket.fresh { box-shadow: 0 0 0 2px var(--new); }
  .t-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: rgba(255,255,255,.03); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .where { font-weight: 800; font-size: 1.1rem; }
  .mode { font-size: .7rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: var(--line); text-transform: uppercase; }
  .mode.delivery { background: #6A3FA0; } .mode.takeaway { background: #2F6F8F; } .mode.table { background: #5A3A22; }
  .timer { margin-inline-start: auto; font-weight: 800; font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 8px; background: rgba(76,184,114,.18); color: var(--ready); }
  .timer.warn { background: rgba(230,162,60,.2); color: var(--prep); }
  .timer.late { background: var(--late); color: #fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .65; } }
  .meta { width: 100%; font-size: .75rem; color: var(--soft); display: flex; gap: 10px; flex-wrap: wrap; }
  .items { list-style: none; padding: 6px 4px; }
  .items li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .items li:hover { background: rgba(255,255,255,.04); }
  .items li.done { opacity: .4; text-decoration: line-through; }
  .q { font-weight: 800; font-size: 1.05rem; min-width: 30px; color: var(--caramel); }
  .items b { font-size: 1rem; }
  .items small { display: block; color: var(--soft); font-size: .78rem; }
  .items .opt { color: #F2C58C; }
  .note { margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px; background: rgba(224,83,61,.15); color: #FFB4A6; font-size: .85rem; font-weight: 600; }
  .t-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .act { flex: 1; padding: 11px; border-radius: 10px; font-weight: 800; font-size: .95rem; color: #120B07; }
  .act.start { background: var(--prep); } .act.ready { background: var(--ready); } .act.serve { background: var(--caramel); }
  .act.back, .act.cancel { flex: 0 0 auto; padding: 11px 13px; background: var(--line); color: var(--text); }

  /* ---------- lock & dialogs ---------- */
  .lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px; }
  .lock form { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 30px; width: min(340px, 100%); display: grid; gap: 14px; text-align: center; }
  .lock img { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto; }
  .lock input { padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); text-align: center; font-size: 1.4rem; letter-spacing: .4em; }
  .lock small { color: var(--soft); }
  dialog { margin: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); width: min(720px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .dlg { display: grid; grid-template-rows: auto 1fr auto; max-height: calc(100vh - 24px); }
  .dlg header, .dlg footer { padding: 14px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dlg header { border-bottom: 1px solid var(--line); }
  .dlg footer { border-top: 1px solid var(--line); }
  .dlg h2 { font-size: 1.1rem; flex: 1; }
  .dlg input, .dlg select, .dlg textarea { padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); }
  .picker { overflow-y: auto; padding: 10px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .pick { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); text-align: start; }
  .pick.on { border-color: var(--caramel); }
  .pick span { font-size: .85rem; } .pick small { color: var(--soft); display: block; }
  .pick .n { background: var(--caramel); color: #1A110C; font-weight: 800; border-radius: 12px; min-width: 24px; height: 24px; display: grid; place-items: center; }
  .total { font-weight: 800; margin-inline-start: auto; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--caramel); color: #1A110C; padding: 10px 20px; border-radius: 999px; font-weight: 800; z-index: 60; opacity: 0; transition: .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="lock" id="lock">
  <form id="lockForm">
    <img src="assets/icon.svg" alt="">
    <h1 style="font-size:1.2rem" data-k="title">Écran cuisine</h1>
    <input type="email" id="email" data-kp="email" placeholder="E-mail" autocomplete="username" hidden>
    <input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="••••" aria-label="PIN" autocomplete="current-password" autofocus>
    <button class="tool primary" data-k="enter">Entrer</button>
    <small data-k="pinHint">Même code que l'administration (1234 par défaut)</small>
  </form>
</div>

<header class="bar">
  <div class="brand"><img src="assets/icon.svg" alt=""><div>Café Mouhsine<small>KITCHEN · BAR</small></div></div>
  <div class="clock" id="clock">--:--</div>
  <div class="seg" id="station" role="group">
    <button data-st="all" class="active" data-k="stAll">Tout</button>
    <button data-st="bar" data-k="stBar">☕ Bar</button>
    <button data-st="kitchen" data-k="stKitchen">🍳 Cuisine</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <button class="tool primary" id="addBtn" data-k="add">＋ Commande</button>
  <button class="tool off" id="soundBtn">🔕</button>
  <button class="tool" id="langBtn">ع</button>
  <button class="tool" id="fsBtn" aria-label="Fullscreen">⛶</button>
  <span class="mode-pill" id="modePill"></span>
  <button class="tool" id="logoutBtn" hidden aria-label="Logout" title="Déconnexion / خروج">⏻</button>
  <a class="tool" href="admin.html" aria-label="Admin">⚙</a>
</header>

<main class="board" id="board">
  <section class="col" data-s="new"><div class="col-head"><span data-k="colNew">Nouvelles</span><span class="count">0</span></div><div class="list"></div></section>
  <section class="col" data-s="preparing"><div class="col-head"><span data-k="colPrep">En préparation</span><span class="count">0</span></div><div class="list"></div></section>
  <section class="col" data-s="ready"><div class="col-head"><span data-k="colReady">Prêtes</span><span class="count">0</span></div><div class="list"></div></section>
</main>

<dialog id="newDlg">
  <form class="dlg" method="dialog" id="newForm">
    <header>
      <h2 data-k="newTitle">Nouvelle commande (comptoir / WhatsApp)</h2>
      <input type="search" id="pickSearch" data-kp="search" placeholder="Rechercher…">
    </header>
    <div class="picker" id="picker"></div>
    <footer>
      <select id="newMode">
        <option value="table" data-k="mTable">Sur place</option>
        <option value="takeaway" data-k="mTakeaway">À emporter</option>
        <option value="delivery" data-k="mDelivery">Livraison</option>
      </select>
      <input id="newDetail" data-kp="detail" placeholder="Table / adresse" size="12">
      <input id="newName" data-kp="name" placeholder="Nom" size="10">
      <input id="newNote" data-kp="note" placeholder="Note" size="14">
      <span class="total" id="newTotal">0 DH</span>
      <button type="button" class="tool" id="newCancel" data-k="cancel">Annuler</button>
      <button type="submit" class="tool primary" id="newCreate" data-k="create">Envoyer en cuisine</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloud-store.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const store = {
    get(k, d) { try { const v = localStorage.getItem("cm_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("cm_" + k, JSON.stringify(v)); } catch {} }
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- kitchen UI strings (staff: French / Arabic) ---------- */
  const TXT = {
    fr: { title: "Écran cuisine", enter: "Entrer", pinHint: "Même code que l'administration (1234 par défaut)", bad: "Code incorrect",
      stAll: "Tout", stBar: "☕ Bar", stKitchen: "🍳 Cuisine", add: "＋ Commande",
      colNew: "Nouvelles", colPrep: "En préparation", colReady: "Prêtes", empty: "Aucune commande",
      start: "▶ Commencer", ready: "✓ Prête", serve: "🛎 Servie", back: "↩", cancelQ: "Annuler la commande {r} ?",
      table: "Table", takeaway: "À emporter", delivery: "Livraison", mTable: "Sur place", mTakeaway: "À emporter", mDelivery: "Livraison",
      served: "servies aujourd'hui", avg: "temps moyen", min: "min", newOrder: "Nouvelle commande : {r}",
      newTitle: "Nouvelle commande (comptoir / WhatsApp)", search: "Rechercher…", detail: "Table / adresse", name: "Nom", note: "Note",
      cancel: "Annuler", create: "Envoyer en cuisine", needItems: "Ajoutez au moins un produit", created: "Commande {r} envoyée",
      soundOn: "Son activé", web: "Site", counter: "Comptoir",
      email: "E-mail", password: "Mot de passe", loginHint: "Compte staff Firebase", loginErr: "E-mail ou mot de passe incorrect",
      notStaff: "Ce compte n'est pas dans la liste du personnel (collection staff)", syncErr: "Erreur de synchronisation — vérifiez la connexion",
      online: "● En ligne", local: "Mode local (cet appareil)" },
    ar: { title: "شاشة المطبخ", enter: "دخول", pinHint: "نفس رمز لوحة الإدارة (1234 افتراضياً)", bad: "رمز خاطئ",
      stAll: "الكل", stBar: "☕ البار", stKitchen: "🍳 المطبخ", add: "＋ طلب",
      colNew: "جديدة", colPrep: "قيد التحضير", colReady: "جاهزة", empty: "لا توجد طلبات",
      start: "▶ ابدأ", ready: "✓ جاهز", serve: "🛎 قُدِّم", back: "↩", cancelQ: "إلغاء الطلب {r}؟",
      table: "طاولة", takeaway: "سفري", delivery: "توصيل", mTable: "في المقهى", mTakeaway: "سفري", mDelivery: "توصيل",
      served: "قُدّمت اليوم", avg: "متوسط الوقت", min: "د", newOrder: "طلب جديد: {r}",
      newTitle: "طلب جديد (الكونتوار / واتساب)", search: "بحث…", detail: "الطاولة / العنوان", name: "الاسم", note: "ملاحظة",
      cancel: "إلغاء", create: "إرسال إلى المطبخ", needItems: "أضف منتوجاً واحداً على الأقل", created: "تم إرسال الطلب {r}",
      soundOn: "تم تفعيل الصوت", web: "الموقع", counter: "الكونتوار",
      email: "البريد الإلكتروني", password: "كلمة المرور", loginHint: "حساب الموظفين على Firebase", loginErr: "البريد أو كلمة المرور غير صحيحة",
      notStaff: "هذا الحساب غير مسجل ضمن الموظفين (staff)", syncErr: "خطأ في المزامنة — تحقق من الاتصال",
      online: "● متصل", local: "وضع محلي (هذا الجهاز)" }
  };
  let lang = store.get("kdsLang", "fr");
  const T = (k, v) => { let s = TXT[lang][k] ?? k; if (v) for (const [a, b] of Object.entries(v)) s = s.replace(`{${a}}`, b); return s; };
  const PL = p => (p[lang] || p.fr)[0];

  /* ---------- catalogue ---------- */
  const overrides = store.get("overrides", {});
  const PRODUCTS = window.CAFE_PRODUCTS.map(p => ({ ...p, available: true, ...(overrides[p.id] || {}) }));
  const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
  const EXTRAS = window.CAFE_EXTRAS;
  // which preparation station handles each category (set menus go to both)
  const STATION = { hot: ["bar"], cold: ["bar"], tea: ["bar"], juice: ["bar"], shop: ["bar"],
    breakfast: ["kitchen"], pastry: ["kitchen"], dessert: ["kitchen"], offers: ["bar", "kitchen"] };
  const optsText = opts => Object.entries(opts || {}).flatMap(([g, v]) => [].concat(v).map(id => {
    const o = EXTRAS[g] && EXTRAS[g].options.find(x => x[0] === id); return o ? (o[2][lang] || o[2].fr) : "";
  })).filter(Boolean).join(" · ");

  /* ---------- orders ---------- */
  const DAY = 18 * 3600e3;
  // orders recorded before the kitchen screen existed have no status
  const statusOf = o => o.status || (Date.now() - o.at < DAY ? "new" : "served");
  let ORDERS = [];
  const load = () => ORDERS;
  // apply a change to status / times / done and save it (Firestore or local)
  function update(ref, fn) {
    const o = ORDERS.find(x => x.ref === ref); if (!o) return;
    const next = { status: statusOf(o), times: { ...(o.times || {}) }, done: [...(o.done || [])] };
    fn(next);
    // serving goes through a transaction that also credits the customer's loyalty points
    const save = next.status === "served" && o.status !== "served" ? CafeOrders.serve : CafeOrders.update;
    save(ref, next).catch(err => { console.warn(err); toast(T("syncErr")); });
  }
  const setStatus = (ref, s) => update(ref, o => { o.status = s; o.times[s] = Date.now(); });

  let station = "all", seen = null, sound = false;
  const fmtTime = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

  function ticket(o) {
    const s = statusOf(o);
    const items = o.items.map((it, idx) => ({ it, idx, p: byId[it.id] }))
      .filter(x => x.p && (station === "all" || (STATION[x.p.cat] || ["bar"]).includes(station)));
    if (!items.length) return "";
    const age = Date.now() - o.at;
    const cls = s === "ready" ? "" : age > 15 * 60e3 ? "late" : age > 8 * 60e3 ? "warn" : "";
    const where = o.mode === "table" ? `${T("table")} ${esc(o.detail || "—")}` : o.mode === "delivery" ? "🛵" : "🥡";
    const done = o.done || [];
    return `
      <article class="ticket ${s === "new" && age < 60e3 ? "fresh" : ""}" data-ref="${esc(o.ref)}">
        <div class="t-head">
          <span class="where">${where}</span>
          <span class="mode ${o.mode}">${T(o.mode)}</span>
          <span class="timer ${cls}" data-at="${o.at}">${fmtTime(age)}</span>
          <div class="meta"><span>#${esc(o.ref)}</span>${o.name ? `<span>👤 ${esc(o.name)}</span>` : ""}
            ${o.mode === "delivery" && o.detail ? `<span>📍 ${esc(o.detail)}</span>` : ""}
            <span>${T(o.source === "counter" ? "counter" : "web")}</span></div>
        </div>
        <ul class="items">
          ${items.map(({ it, idx, p }) => `
            <li class="${done.includes(idx) ? "done" : ""}" data-item="${idx}">
              <span class="q">${it.qty}×</span>
              <div><b>${esc(PL(p))}</b>${it.size || optsText(it.opts) ? `<small>${esc(it.size || "")}${it.size && optsText(it.opts) ? " · " : ""}<span class="opt">${esc(optsText(it.opts))}</span></small>` : ""}</div>
            </li>`).join("")}
        </ul>
        ${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ""}
        <div class="t-foot">
          ${s === "new" ? `<button class="act cancel" data-do="cancel" aria-label="cancel">✕</button><button class="act start" data-do="preparing">${T("start")}</button>` : ""}
          ${s === "preparing" ? `<button class="act back" data-do="new">${T("back")}</button><button class="act ready" data-do="ready">${T("ready")}</button>` : ""}
          ${s === "ready" ? `<button class="act back" data-do="preparing">${T("back")}</button><button class="act serve" data-do="served">${T("serve")}</button>` : ""}
        </div>
      </article>`;
  }

  function render() {
    const orders = load();
    ["new", "preparing", "ready"].forEach(s => {
      const col = $(`.col[data-s="${s}"]`);
      const html = orders.filter(o => statusOf(o) === s).sort((a, b) => a.at - b.at).map(ticket).filter(Boolean);
      $(".count", col).textContent = html.length;
      $(".list", col).innerHTML = html.join("") || `<p class="empty">${T("empty")}</p>`;
    });
    const today = new Date().toDateString();
    const served = orders.filter(o => o.status === "served" && o.times && o.times.served && new Date(o.times.served).toDateString() === today);
    const waits = served.filter(o => o.times.ready).map(o => o.times.ready - o.at);
    const avg = waits.length ? Math.round(waits.reduce((a, b) => a + b, 0) / waits.length / 60e3) : 0;
    $("#stats").innerHTML = `<span><b>${served.length}</b> ${T("served")}</span><span><b>${avg}</b> ${T("min")} ${T("avg")}</span>`;

    // chime + toast when a new order shows up
    const fresh = orders.filter(o => statusOf(o) === "new").map(o => o.ref);
    if (seen) { const added = fresh.filter(r => !seen.has(r)); if (added.length) { chime(); toast(T("newOrder", { r: added.join(", ") })); } }
    seen = new Set(fresh);
  }

  function tick() {
    const d = new Date();
    $("#clock").textContent = d.toLocaleTimeString(lang === "ar" ? "ar-MA" : "fr-FR", { hour: "2-digit", minute: "2-digit" });
    $$(".timer[data-at]").forEach(el => {
      const age = Date.now() - +el.dataset.at; el.textContent = fmtTime(age);
      if (el.closest(".col").dataset.s !== "ready") {
        el.classList.toggle("warn", age > 8 * 60e3 && age <= 15 * 60e3);
        el.classList.toggle("late", age > 15 * 60e3);
      }
    });
  }

  /* ---------- sound ---------- */
  let audio;
  function chime() {
    if (!sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [880, 1175].forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * .18;
        o.frequency.value = f; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .35);
        o.start(t0); o.stop(t0 + .4);
      });
    } catch {}
  }
  let toastTimer;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3000); }

  /* ---------- events ---------- */
  $("#board").addEventListener("click", e => {
    const card = e.target.closest(".ticket"); if (!card) return;
    const ref = card.dataset.ref;
    const act = e.target.closest("[data-do]");
    if (act) {
      if (act.dataset.do === "cancel") { if (confirm(T("cancelQ", { r: ref }))) setStatus(ref, "cancelled"); return; }
      setStatus(ref, act.dataset.do); return;
    }
    const li = e.target.closest("[data-item]");
    if (li) update(ref, o => { const i = +li.dataset.item; o.done = o.done.includes(i) ? o.done.filter(x => x !== i) : [...o.done, i]; });
  });
  $("#station").addEventListener("click", e => {
    const b = e.target.closest("[data-st]"); if (!b) return;
    station = b.dataset.st; $$("#station button").forEach(x => x.classList.toggle("active", x === b)); render();
  });
  $("#soundBtn").addEventListener("click", () => {
    sound = !sound; $("#soundBtn").textContent = sound ? "🔔" : "🔕"; $("#soundBtn").classList.toggle("off", !sound);
    if (sound) { chime(); toast(T("soundOn")); }
  });
  $("#fsBtn").addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}));
  $("#langBtn").addEventListener("click", () => { lang = lang === "fr" ? "ar" : "fr"; store.set("kdsLang", lang); applyLang(); });

  function applyLang() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    $("#langBtn").textContent = lang === "fr" ? "ع" : "FR";
    $$("[data-k]").forEach(el => { el.textContent = T(el.dataset.k); });
    $$("[data-kp]").forEach(el => { el.placeholder = T(el.dataset.kp); });
    render(); renderPicker();
  }

  /* ---------- manual order (counter / WhatsApp) ---------- */
  let draft = {};
  function renderPicker() {
    const q = $("#pickSearch").value.trim().toLowerCase();
    const list = PRODUCTS.filter(p => p.available && (!q || [p.ar, p.fr, p.en].flat().join(" ").toLowerCase().includes(q)));
    $("#picker").innerHTML = list.map(p => `
      <button type="button" class="pick ${draft[p.id] ? "on" : ""}" data-pick="${p.id}">
        <span>${esc(PL(p))}<small>${p.price} DH</small></span>
        ${draft[p.id] ? `<span class="n">${draft[p.id]}</span>` : ""}
      </button>`).join("");
    const total = Object.entries(draft).reduce((s, [id, n]) => s + byId[id].price * n, 0);
    $("#newTotal").textContent = total + " DH";
  }
  $("#addBtn").addEventListener("click", () => { draft = {}; $("#newForm").reset(); renderPicker(); $("#newDlg").showModal(); });
  $("#pickSearch").addEventListener("input", renderPicker);
  // click adds one, right-click / long-press removes one
  $("#picker").addEventListener("click", e => { const b = e.target.closest("[data-pick]"); if (b) { draft[b.dataset.pick] = (draft[b.dataset.pick] || 0) + 1; renderPicker(); } });
  $("#picker").addEventListener("contextmenu", e => {
    const b = e.target.closest("[data-pick]"); if (!b) return; e.preventDefault();
    const id = b.dataset.pick; if (draft[id] > 1) draft[id]--; else delete draft[id]; renderPicker();
  });
  $("#newCancel").addEventListener("click", () => $("#newDlg").close());
  $("#newForm").addEventListener("submit", e => {
    e.preventDefault();
    const ids = Object.keys(draft); if (!ids.length) { toast(T("needItems")); return; }
    const ref = CafeOrders.newRef("CPT");
    const items = ids.map(id => ({ id, size: byId[id].sizes ? byId[id].sizes[0][0] : null, qty: draft[id], opts: {} }));
    const order = { ref, at: Date.now(), mode: $("#newMode").value, detail: $("#newDetail").value.trim(), name: $("#newName").value.trim(),
      note: $("#newNote").value.trim(), total: items.reduce((s, i) => s + byId[i.id].price * i.qty, 0),
      status: "new", times: {}, done: [], source: "counter", lang, items };
    seen && seen.add(ref);   // no chime for orders entered on this screen
    $("#newDlg").close();
    CafeOrders.addCounter(order).then(() => toast(T("created", { r: ref }))).catch(err => { console.warn(err); toast(T("syncErr")); });
  });

  /* ---------- access: staff account (Firebase) or PIN (local mode) ---------- */
  const ONLINE = CafeOrders.mode === "firebase";
  let started = false;
  function unlock() {
    if (started) return; started = true;
    $("#lock").hidden = true; applyLang(); tick(); setInterval(tick, 1000); setInterval(render, 15000);
    $("#modePill").textContent = T(ONLINE ? "online" : "local"); $("#modePill").classList.toggle("on", ONLINE);
    $("#logoutBtn").hidden = !ONLINE;
    CafeOrders.watchAll(Date.now() - DAY, list => { ORDERS = list; render(); }, err => { console.warn(err); toast(T("syncErr")); });
  }
  $("#lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (ONLINE) {
      const res = await CafeOrders.signIn($("#email").value.trim(), $("#pin").value);
      if (res.ok) unlock(); else { $("#pin").value = ""; toast(T(res.error === "not-staff" ? "notStaff" : "loginErr")); }
      return;
    }
    if ($("#pin").value === store.get("pin", "1234")) { try { sessionStorage.setItem("cm_admin", "1"); } catch {} unlock(); }
    else { $("#pin").value = ""; toast(T("bad")); }
  });
  $("#logoutBtn").addEventListener("click", async () => { await CafeOrders.signOut(); location.reload(); });
  $$("[data-k]").forEach(el => { el.textContent = T(el.dataset.k); });
  if (ONLINE) {
    $("#email").hidden = false;
    $("#pin").removeAttribute("maxlength"); $("#pin").removeAttribute("inputmode");
    $("#pin").placeholder = T("password"); $(".lock small").textContent = T("loginHint");
    CafeOrders.staffUser().then(u => { if (u) unlock(); });
  } else {
    try { if (sessionStorage.getItem("cm_admin") === "1") unlock(); } catch {}
  }
})();
</script>
</body>
</html>
